[project]
name = "caffeine"
version = "1.2.0"
description = "Windows system tray app to keep your screen awake"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
caffeine = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
