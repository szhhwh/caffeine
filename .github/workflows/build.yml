name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra build

      - name: Build with PyInstaller
        run: uv run python build.py

      - name: Extract version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Inject version into installer.iss
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: uv run python scripts/inject_version.py

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: choco install innosetup --no-progress

      - name: Download Inno Setup Chinese language
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $langDir = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile "$langDir\ChineseSimplified.isl"

      - name: Compile installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: iscc installer.iss

      - name: Create portable zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist\Caffeine.exe -DestinationPath "dist\Caffeine_Portable_$env:VERSION_x64.zip"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caffeine-windows
          path: dist/Caffeine.exe

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Caffeine-release
          path: |
            installer_output/Caffeine_Setup_${{ env.VERSION }}_x64.exe
            dist/Caffeine_Portable_${{ env.VERSION }}_x64.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: Caffeine-windows
          path: dist

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: Caffeine-release
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Caffeine.exe
            release/Caffeine_Setup_*_x64.exe
            release/Caffeine_Portable_*_x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}